name: Build and Distribute

# Builds the signed Connect IQ store package (.iq) and attaches it to the GitHub
# Release. It is called by the Release Please workflow once a release is created,
# and can also be run manually against an existing tag.
#
# Garmin has no public API to publish to the Connect IQ Store, so uploading the
# attached .iq to the store (with description, screenshots and release notes)
# stays a manual step in the developer dashboard at apps.garmin.com.
#
# Signing uses the private developer key stored as the DEVELOPER_KEY_BASE64
# secret (base64 of developer_key.der). The build runs inside the same SDK
# container the CI tests use.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the .iq to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and attach the .iq to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .iq asset to the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Build signed .iq store package
        env:
          DEVELOPER_KEY_BASE64: ${{ secrets.DEVELOPER_KEY_BASE64 }}
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            -e DEVELOPER_KEY_BASE64 \
            --entrypoint bash \
            ghcr.io/matco/connectiq-tester:latest -c '
              set -eu
              echo "$DEVELOPER_KEY_BASE64" | base64 -d > /tmp/developer_key.der
              /connectiq/bin/monkeyc \
                -f monkey.jungle \
                -o GarminRaceStats.iq \
                -e -r \
                -y /tmp/developer_key.der
            '

      - name: Attach .iq to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" GarminRaceStats.iq --clobber
